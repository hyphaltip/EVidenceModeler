[workspace]
name = "evidencemodeler"
version = "2.5.0"
description = "EVidenceModeler (Rust): consensus gene structure annotation from multiple evidence sources"
authors = ["Jason Stajich <jasonst@ucr.edu>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
license = "BSD-3-Clause"
readme = "README.md"

# ---------------------------------------------------------------------------
# Default environment: everything needed to build & test the Rust workspace.
# ---------------------------------------------------------------------------
[dependencies]
rust = ">=1.75"
# C/C++ compilers: needed to link the Rust binaries and to build the legacy
# ParaFly plugin (only used by the Perl EVM path).
c-compiler = "*"
cxx-compiler = "*"
make = "*"

[tasks]
build       = { cmd = "cargo build --release --manifest-path evm/Cargo.toml", description = "Build release binaries into evm/target/release" }
build-debug = { cmd = "cargo build --manifest-path evm/Cargo.toml", description = "Debug build" }
test        = { cmd = "cargo test --manifest-path evm/Cargo.toml --all", description = "Run unit + golden integration tests" }
fmt         = { cmd = "cargo fmt --manifest-path evm/Cargo.toml --all", description = "Format the workspace" }
fmt-check   = { cmd = "cargo fmt --manifest-path evm/Cargo.toml --all --check", description = "Check formatting (CI)" }
clippy      = { cmd = "cargo clippy --manifest-path evm/Cargo.toml --all-targets --all-features -- -D warnings", description = "Lint with clippy (deny warnings)" }
e2e         = { cmd = "bash runMe.rust.sh", cwd = "testing", depends-on = ["build"], description = "End-to-end pipeline test" }
ci          = { depends-on = ["fmt-check", "clippy", "test", "e2e"], description = "Full CI gate locally" }
install     = { cmd = "cargo install --path evm/evm-cli && cargo install --path evm/evm-utils", description = "cargo install all binaries into ~/.cargo/bin" }

# ---------------------------------------------------------------------------
# Optional feature: the Perl/Python helper converters (BPbtab, miniprot, etc.)
# and any funannotate Perl-EVM fallback. Not required for the Rust engine.
# ---------------------------------------------------------------------------
[feature.helpers.dependencies]
perl = "*"
perl-db_file = "*"
perl-uri = "*"
perl-bioperl = "*"
python = ">=3.8"

[feature.helpers.activation.env]
# Point the Perl helpers (which `use lib "$EVM_HOME/PerlLib"`) at the checkout.
EVM_HOME = "$PIXI_PROJECT_ROOT"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[environments]
default = { solve-group = "default" }
full    = { features = ["helpers"], solve-group = "default" }
